name: Build Core

on:
  push:
    branches:
      - dev-next-e5
      - merge-e5
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
      tags: ${{ steps.set-var.outputs.TAGS }}
      telegram-ready: ${{ steps.set-var.outputs.telegram-ready }}
      sing-box-version: ${{ steps.set-var.outputs.sing-box-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Variables
        id: set-var
        run: |
          echo tags=$TAGS >> $GITHUB_OUTPUT
          echo sing-box-version=$(CGO_ENABLED=0 GOOS="linux" GOARCH="amd64" go run ./cmd/internal/read_tag) >> $GITHUB_OUTPUT
          if [[ -n $API_HASH && -n $API_ID && -n $BOT_TOKEN && -n $CHAT_ID ]]; then
            echo telegram-ready=true >> $GITHUB_OUTPUT
          fi
        env:
          API_HASH: ${{ secrets.API_HASH }}
          API_ID: ${{ secrets.API_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TAGS: with_gvisor,with_dhcp,with_wireguard,with_clash_api,with_quic,with_utls,with_ech

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include:
          # windows
          - name: windows-amd64
            goos: windows
            goarch: amd64
            goamd64: v3

          # linux
          - name: linux-amd64
            goos: linux
            goarch: amd64
            goamd64: v3

          # darwin
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            goamd64: v3

          # android
          - name: android-arm64
            goos: android
            goarch: arm64
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup NDK
        if: matrix.goos == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VERSION: ${{ needs.prepare.outputs.sing-box-version }}
        run: |
          if [[ ${GOOS} == "android" ]]; then
            export CGO_ENABLED=1
            export CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          fi
          go build -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags ${TAGS} ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.name }}
          path: sing-box*